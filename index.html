<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palier</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palier">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --fond: #14171c; --carte: #1e232b; --texte: #eef1f5; --doux: #8b95a5; --accent: #9fb8d9; --trait: #2c333e; --alerte: #e0b060; }
  @media (prefers-color-scheme: light) {
    :root { --fond: #f2f4f7; --carte: #ffffff; --texte: #1a1e25; --doux: #5f6878; --accent: #3f6ea8; --trait: #dde2e9; --alerte: #9a6a00; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--fond); color: var(--texte);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 84px);
    max-width: 520px; margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: baseline; color: var(--doux); font-size: 14px; }
  h1 { font-size: 28px; margin: 16px 0 4px; }
  h2 { font-size: 17px; margin: 20px 0 8px; }
  p { margin: 6px 0; }
  .doux { color: var(--doux); }
  .petit { font-size: 14px; }
  .alerte { color: var(--alerte); }
  .carte { background: var(--carte); border-radius: 16px; padding: 16px; margin: 12px 0; }
  button, input, select { font: inherit; color: inherit; }
  button.choix {
    display: block; width: 100%; text-align: left; background: var(--carte); color: var(--texte);
    border: 2px solid var(--trait); border-radius: 16px; padding: 16px; margin: 12px 0;
  }
  button.choix[aria-pressed="true"] { border-color: var(--accent); }
  .titre-carte { font-size: 15px; color: var(--doux); }
  .grand { font-size: 34px; font-weight: 700; line-height: 1.15; margin: 6px 0; }
  .principal {
    display: block; width: 100%; min-height: 54px; border: 0; border-radius: 14px;
    background: var(--accent); color: var(--fond); font-size: 18px; font-weight: 600; margin: 12px 0;
  }
  .principal:disabled { opacity: .35; }
  .secondaire {
    min-height: 44px; padding: 0 16px; border: 1px solid var(--trait); border-radius: 12px; background: none; margin: 4px 0;
  }
  .lien { background: none; border: 0; color: var(--accent); padding: 10px 0; min-height: 44px; text-decoration: underline; }
  label.ligne { display: block; margin: 16px 0 4px; }
  label.ligne span { float: right; font-weight: 700; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; height: 44px; accent-color: var(--accent); }
  input[type=time], input[type=date], input[type=text], input[type=url] {
    width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); font-size: 17px;
  }
  .segments { display: flex; gap: 6px; }
  .segments button { flex: 1; min-height: 48px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); }
  .segments button[aria-pressed="true"] { background: var(--accent); color: var(--fond); border-color: var(--accent); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--trait); }
  tr.courant td { color: var(--accent); font-weight: 700; }
  ul.conseils { margin: 6px 0; padding-left: 20px; }
  tr.passe td { color: var(--doux); }
  tr.modifiable { cursor: pointer; }
  tr.choisi td { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .barre { height: 10px; border-radius: 5px; background: var(--trait); overflow: hidden; margin: 6px 0; }
  .barre div { height: 100%; background: var(--accent); }
  .boutons { display: flex; gap: 8px; flex-wrap: wrap; }
  .grille { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 13px; }
  .grille .j { color: var(--doux); }
  .grille .auj { color: var(--accent); font-weight: 700; }
  .pa { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--doux); margin: 6px auto; }
  .pa.pleine { background: var(--accent); border-color: var(--accent); }
  .pa.demi { background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); border-color: var(--accent); }
  .pa.ecart { background: var(--alerte); border-color: var(--alerte); }
  .pa.inconnu { border-style: dashed; opacity: .4; }
  .barres { height: 64px; display: flex; justify-content: center; align-items: flex-end; gap: 3px; }
  .barres div { width: 9px; border-radius: 3px 3px 0 0; min-height: 2px; }
  .b-fog { background: var(--doux); }
  .b-sleep { background: var(--accent); }
  .legende { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--doux); margin-top: 10px; align-items: center; }
  .legende .pa, .legende .b { display: inline-block; vertical-align: middle; margin: 0 4px 0 0; }
  .legende .pa { width: 14px; height: 14px; }
  .legende .b { width: 9px; height: 14px; border-radius: 2px; }
  .nav-sem { display: flex; justify-content: space-between; align-items: center; }
  .nav-sem button { min-width: 44px; }
  select { min-height: 44px; padding: 0 8px; border: 1px solid var(--trait); border-radius: 10px; background: var(--carte); font-size: 17px; width: 100%; }
  .champs { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  svg text { fill: var(--doux); font-size: 10px; }
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; display: flex;
    background: var(--carte); border-top: 1px solid var(--trait);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button { flex: 1; min-height: 56px; border: 0; background: none; color: var(--doux); font-size: 13px; }
  nav button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  section[hidden], [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <span id="reseau">…</span>
  <span id="version"></span>
</header>

<main>
  <!-- Premier lancement : confirmation du plan et de la date de début -->
  <section id="depart" hidden>
    <h1>Bienvenue</h1>
    <p class="doux">Voici le plan par défaut. Il reste modifiable plus tard.</p>
    <div id="departPlan"></div>
    <label class="ligne" for="departDate">Date de début du plan</label>
    <input type="date" id="departDate">
    <button class="principal" id="departOk">Commencer</button>
    <p class="doux petit">Pour reprendre une sauvegarde, utilise plutôt Réglages, Importer.</p>
  </section>

  <section id="soir" hidden>
    <h1>Ce soir</h1>
    <div id="soirContenu"></div>
  </section>

  <section id="matin" hidden>
    <h1>Ce matin</h1>
    <div id="matinContenu"></div>
  </section>

  <section id="semaine" hidden>
    <h1>Semaine</h1>
    <div id="semaineContenu"></div>
  </section>

  <section id="plan" hidden>
    <h1>Plan</h1>
    <div id="planContenu"></div>
  </section>

  <section id="reglages" hidden>
    <h1>Réglages</h1>

    <h2>Date de début du plan</h2>
    <input type="date" id="regDate">
    <button class="secondaire" id="regDateOk">Enregistrer la date</button>

    <h2>Google Sheet</h2>
    <label class="ligne doux petit" for="regUrl">Adresse du script (finit par /exec)</label>
    <input type="url" id="regUrl" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off">
    <button class="secondaire" id="regUrlOk">Enregistrer l'adresse</button>
    <button class="secondaire" id="regEnvoyer">Envoyer maintenant</button>
    <p class="doux petit" id="regFile"></p>

    <h2>Sauvegarde</h2>
    <button class="secondaire" id="regExport">Exporter (JSON)</button>
    <button class="secondaire" id="regImportBtn">Importer (JSON)</button>
    <input type="file" id="regImport" accept="application/json,.json" hidden>

    <h2>Réinitialiser</h2>
    <button class="secondaire" id="regReset">Tout effacer sur ce téléphone</button>
    <p class="doux petit">Le Google Sheet n'est pas touché.</p>
  </section>
</main>

<nav id="nav">
  <button data-ecran="soir">Ce soir</button>
  <button data-ecran="matin">Ce matin</button>
  <button data-ecran="semaine">Semaine</button>
  <button data-ecran="plan">Plan</button>
  <button data-ecran="reglages">Réglages</button>
</nav>

<script>
const VERSION = 'v3';
const CLE = 'palier.etat';
const $ = id => document.getElementById(id);

// ---------- Textes d'accompagnement (statiques) ----------
const TEXTES = {
  rebond: 'Première semaine de ce palier : une à deux semaines de sommeil plus difficile sont attendues. C\'est transitoire.',
  conseils: [
    'Si tu es éveillé plus de 20 minutes, lève-toi et va dans une autre pièce.',
    'Pas d\'écran au lit.',
    'Garde ton heure de lever fixe, même après une mauvaise nuit.',
  ],
  ecart: 'Écart noté. Ça arrive. Le plan continue ce soir.',
  tardive: 'Prise tardive. Effets résiduels plus probables en journée.',
  finPalier: 'Dernière semaine de ce palier. Beau travail.',
  finPlan: 'Le plan est terminé. Bravo. Garde le journal encore deux semaines.',
};

const PLAN_DEFAUT = [
  { id: 'p1', label: 'Sem 1-2',   durationWeeks: 2, doseMg: 3.75,  nightsPerWeek: 6, rescueDoseMg: 3.75 },
  { id: 'p2', label: 'Sem 3-4',   durationWeeks: 2, doseMg: 3.75,  nightsPerWeek: 4, rescueDoseMg: 3.75 },
  { id: 'p3', label: 'Sem 5-6',   durationWeeks: 2, doseMg: 1.875, nightsPerWeek: 4, rescueDoseMg: 3.75 },
  { id: 'p4', label: 'Sem 7-8',   durationWeeks: 2, doseMg: 1.875, nightsPerWeek: 2, rescueDoseMg: 1.875 },
  { id: 'p5', label: 'Sem 9-10',  durationWeeks: 2, doseMg: 1.875, nightsPerWeek: 1, rescueDoseMg: 1.875 },
  { id: 'p6', label: 'Sem 11-12', durationWeeks: 2, doseMg: 0,     nightsPerWeek: 0, rescueDoseMg: null },
];
const DOSES = [0, 1.875, 3.75, 7.5];

// ---------- Stockage ----------
function charger() {
  try { const e = JSON.parse(localStorage.getItem(CLE)); if (e) return e; } catch {}
  return { plan: null, jours: {}, cfg: { url: '' }, file: [] };
}
let etat = charger();
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch {} }

// ---------- Dates (jour civil local, AAAA-MM-JJ) ----------
const p2 = n => String(n).padStart(2, '0');
const jour = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const versDate = s => { const [a, m, j] = s.split('-').map(Number); return new Date(a, m - 1, j); };
const ajouter = (s, n) => { const d = versDate(s); d.setDate(d.getDate() + n); return jour(d); };
const ecartJours = (a, b) => Math.round((versDate(a) - versDate(b)) / 864e5);
const aujourdhui = () => jour(new Date());
// Le soir court jusqu'à 6 h : à 1 h du matin, on est encore « ce soir » de la veille
const soirCourant = () => jour(new Date(Date.now() - 6 * 3600e3));
const joli = s => versDate(s).toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' });
function isoLocal(d = new Date()) {
  const dec = -d.getTimezoneOffset(), sg = dec >= 0 ? '+' : '-', a = Math.abs(dec);
  return `${jour(d)}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}${sg}${p2(a / 60 | 0)}:${p2(a % 60)}`;
}
const mg = n => String(n).replace('.', ',') + ' mg';
const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

// ---------- Logique du plan ----------
// Situe un soir (date de la nuit) dans le plan : palier, semaine du plan, début de cette semaine.
function situer(s) {
  const plan = etat.plan, k = ecartJours(s, plan.startDate);
  if (k < 0) return { avant: true };
  const semPlan = Math.floor(k / 7), debutSemaine = ajouter(plan.startDate, semPlan * 7);
  let cumul = 0;
  for (const p of plan.paliers) {
    if (semPlan < cumul + p.durationWeeks) return { palier: p, semPlan, debutSemaine, semDansPalier: semPlan - cumul + 1, fini: false };
    cumul += p.durationWeeks;
  }
  return { palier: plan.paliers[plan.paliers.length - 1], semPlan, debutSemaine, semDansPalier: null, fini: true };
}
// La nuit du soir s est saisie le matin du lendemain
const doseNuit = n => etat.jours[ajouter(n, 1)]?.morning?.doseTaken ?? null;
function nuitsAvecDose(debut, finExclue) {
  let c = 0;
  for (let n = debut; n < finExclue; n = ajouter(n, 1)) if (doseNuit(n) > 0) c++;
  return c;
}
// Écart (validé, point 8) :
// dose prise alors que le budget de nuits de la semaine était épuisé, ou dose plus forte que celle du palier.
function estEcart(n) {
  const c = situer(n), d = doseNuit(n);
  if (c.avant || !(d > 0)) return false;
  return nuitsAvecDose(c.debutSemaine, n) >= c.palier.nightsPerWeek || d > c.palier.doseMg;
}
function ecartsDuMois(s) {
  let c = 0;
  for (let n = s.slice(0, 8) + '01'; n < s; n = ajouter(n, 1)) if (n >= etat.plan.startDate && estEcart(n)) c++;
  return c;
}
function nuitsSansJournal(c, s) {
  let c2 = 0;
  for (let n = c.debutSemaine; n < s; n = ajouter(n, 1)) if (!etat.jours[ajouter(n, 1)]?.morning) c2++;
  return c2;
}

// ---------- Semaine du plan et suggestion hebdomadaire ----------
const fmt1 = x => x.toFixed(1).replace('.', ',');
const moyenne = l => l.length ? l.reduce((a, b) => a + b, 0) / l.length : null;
const debutSem = w => ajouter(etat.plan.startDate, w * 7);
function totalSemaines() { let t = 0; etat.plan.paliers.forEach(p => t += p.durationWeeks); return t; }

function statsSemaine(w) {
  const debut = debutSem(w);
  const nuits = [...Array(7)].map((_, i) => ajouter(debut, i));
  const matins = nuits.map(n => etat.jours[ajouter(n, 1)]?.morning || null);
  const ecarts = nuits.filter(n => n >= etat.plan.startDate && estEcart(n)).length;
  const saisis = matins.filter(Boolean);
  // Tendance du brouillard : pente simple (moindres carrés) sur les jours saisis, ramenée à 7 jours
  const pts = matins.map((m, i) => m ? [i, m.fog] : null).filter(Boolean);
  let hausseFog = null;
  if (pts.length >= 3) {
    const mx = moyenne(pts.map(p => p[0])), my = moyenne(pts.map(p => p[1]));
    const num = pts.reduce((a, [x, y]) => a + (x - mx) * (y - my), 0), den = pts.reduce((a, [x]) => a + (x - mx) ** 2, 0);
    hausseFog = den ? num / den * 6 : 0;
  }
  return {
    debut, nuits, matins, ecarts, nbSaisis: saisis.length,
    sommeil: moyenne(saisis.map(m => m.sleepQuality)), brouillard: moyenne(saisis.map(m => m.fog)),
    hausseFog, terminee: soirCourant() >= nuits[6],
  };
}

// Règles du PRD 6.3. L'app suggère, l'utilisateur confirme ; elle ne change jamais le plan seule.
function suggestion(w) {
  const s = statsSemaine(w), raisons = [];
  if (s.ecarts >= 2) raisons.push(`${s.ecarts} écarts cette semaine`);
  if (s.sommeil != null && s.sommeil < 4) raisons.push(`sommeil moyen de ${fmt1(s.sommeil)} sur 10`);
  if (s.hausseFog != null && s.hausseFog > 1) raisons.push(`brouillard en hausse de ${fmt1(s.hausseFog)} points`);
  if (raisons.length) return { type: 'tenir', raisons, s };
  if (s.terminee && s.ecarts <= 1 && s.sommeil != null && s.sommeil >= 5) return { type: 'avancer', s };
  return { type: 'neutre', s };
}

function carteSuggestion(w, actif = true) {
  const sg = suggestion(w), c = situer(debutSem(w));
  if (c.avant) return '';
  const p = c.palier, i = etat.plan.paliers.indexOf(p), suivant = etat.plan.paliers[i + 1];
  const finDePalier = !c.fini && c.semDansPalier === p.durationWeeks;
  const decision = (etat.decisions || {})[w];
  let h = `<div class="carte"><div class="titre-carte">Suggestion de la semaine ${w + 1}</div>`;
  if (finDePalier) h += `<p>${TEXTES.finPalier}</p>`;
  if (sg.type === 'tenir') {
    h += `<div class="grand" style="font-size:24px">Tenir le palier</div><p class="doux">${sg.raisons.join(', ')}.</p>`;
  } else if (sg.type === 'avancer' && finDePalier && suivant) {
    h += `<div class="grand" style="font-size:24px">Passer au palier suivant</div>` +
         `<p class="doux">${suivant.label} : ${mg(suivant.doseMg)}, ${suivant.nightsPerWeek} nuit(s) par semaine, à partir du ${joli(debutSem(w + 1))}.</p>`;
  } else if (sg.type === 'avancer') {
    h += `<div class="grand" style="font-size:24px">Continuer comme prévu</div><p class="doux">Bonne semaine : ${sg.s.ecarts} écart(s), sommeil moyen ${fmt1(sg.s.sommeil)}.</p>`;
  } else {
    h += `<div class="grand" style="font-size:24px">Continuer comme prévu</div>` +
         `<p class="doux">${sg.s.nbSaisis < 3 ? 'Pas assez de matins saisis pour juger.' : 'Pas de signal net cette semaine.'}</p>`;
  }
  if (decision) {
    h += `<p><strong>${decision === 'prolonger' ? 'Palier prolongé d\'une semaine.' : 'Suggestion acceptée.'}</strong></p>`;
  } else if (actif) {
    h += `<div class="boutons">`;
    if (sg.type === 'tenir') h += `<button class="principal" data-action="prolonger" data-w="${w}">Prolonger d'une semaine</button>`;
    else {
      h += `<button class="principal" data-action="accepter" data-w="${w}">D'accord</button>`;
      h += `<button class="secondaire" data-action="prolonger" data-w="${w}">Prolonger d'une semaine</button>`;
    }
    h += `</div>`;
  }
  return h + `</div>`;
}

function decider(w, quoi) {
  etat.decisions = etat.decisions || {};
  if (etat.decisions[w]) return;
  if (quoi === 'prolonger') {
    if (!confirm('Ajouter une semaine au palier en cours ? Les paliers suivants sont décalés d\'autant.')) return;
    situer(debutSem(w)).palier.durationWeeks += 1;
  }
  etat.decisions[w] = quoi;
  sauver();
  afficher(ecranActuel);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if (b.dataset.action === 'prolongerPlan' || b.dataset.action === 'recommencer') return actionPlan(b.dataset.action);
  if (b.dataset.action === 'prolonger' || b.dataset.action === 'accepter') decider(Number(b.dataset.w), b.dataset.action === 'prolonger' ? 'prolonger' : 'accepter');
});

// ---------- Envoi au Google Sheet ----------
let envoiEnCours = false, derniereErreur = '';
function enFile(onglet, id, valeurs) {
  etat.file = etat.file.filter(x => x.id !== id);
  etat.file.push({ onglet, id, valeurs });
  sauver();
  envoyer();
}
async function envoyer() {
  if (envoiEnCours || !etat.cfg.url || !navigator.onLine) { majFile(); return; }
  envoiEnCours = true;
  try {
    while (etat.file.length) {
      const x = etat.file[0];
      // text/plain évite la pré-vérification CORS, qu'Apps Script ne gère pas
      const r = await fetch(etat.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(x) });
      let rep; try { rep = JSON.parse(await r.text()); } catch { throw new Error(`réponse inattendue du script (${r.status})`); }
      if (!rep.ok) throw new Error(rep.erreur || 'refus du script');
      if (etat.file[0] === x) etat.file.shift(); else etat.file = etat.file.filter(y => y !== x);
      sauver();
      derniereErreur = '';
    }
  } catch (e) { derniereErreur = e.message; }
  finally { envoiEnCours = false; majFile(); }
}
function majFile() {
  const n = etat.file.length;
  $('regFile').textContent = !etat.cfg.url ? 'Aucune adresse : les saisies restent sur le téléphone.'
    : n ? `${pluriel(n, 'saisie')} en attente d'envoi.${derniereErreur ? ' Dernière erreur : ' + derniereErreur : ''}`
    : 'Tout est envoyé.';
}

// ---------- Navigation ----------
let ecranActuel = null, ecranActuelPrec = null, palierChoisi = null, semVue = null;
function afficher(ecran) {
  if (!etat.plan && ecran !== 'reglages') ecran = 'depart';
  ecranActuel = ecran;
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== ecran);
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.ecran === ecran) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (ecran !== ecranActuelPrec) { palierChoisi = null; semVue = null; scrollTo(0, 0); }
  ecranActuelPrec = ecran;
  ({ depart: rendreDepart, soir: rendreSoir, matin: rendreMatin, semaine: rendreSemaine, plan: rendrePlan, reglages: rendreReglages }[ecran] || (() => {}))();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => afficher(b.dataset.ecran));
const ecranParDefaut = () => new Date().getHours() < 12 ? 'matin' : 'soir';

// ---------- Tableau du plan ----------
function tablePlan(paliers, courantId) {
  return `<table><tr><th>Palier</th><th>Sem.</th><th>Dose</th><th>Nuits</th><th>Secours</th></tr>` +
    paliers.map(p => `<tr class="${p.id === courantId ? 'courant' : ''}"><td>${p.label}</td><td>${p.durationWeeks}</td>` +
      `<td>${mg(p.doseMg)}</td><td>${p.nightsPerWeek}/sem</td><td>${p.rescueDoseMg == null ? 'aucune' : mg(p.rescueDoseMg)}</td></tr>`).join('') +
    `</table>`;
}

// ---------- Premier lancement ----------
function rendreDepart() {
  $('departPlan').innerHTML = `<div class="carte">${tablePlan(PLAN_DEFAUT)}</div>`;
  if (!$('departDate').value) $('departDate').value = aujourdhui();
}
$('departOk').onclick = () => {
  const d = $('departDate').value;
  if (!d) return;
  etat.plan = { startDate: d, paliers: structuredClone(PLAN_DEFAUT) };
  sauver();
  afficher(ecranParDefaut());
};

// ---------- Ce soir ----------
let choixSoir = null, modifierSoir = false;
function cartesSoir(c, budget, s) {
  const p = c.palier;
  let a;
  if (budget > 0 && p.doseMg > 0) {
    a = { dose: p.doseMg, grand: mg(p.doseMg) + ' au coucher',
          texte: `Il te reste ${pluriel(budget, 'nuit')} avec dose cette semaine, ce soir compris.` };
  } else if (p.rescueDoseMg != null && p.rescueDoseMg > 0) {
    a = { dose: p.rescueDoseMg, avant: 'Nuit critique', grand: mg(p.rescueDoseMg),
          texte: `Tu peux prendre ${mg(p.rescueDoseMg)}, mais ça compte comme un écart au plan. Écarts ce mois-ci : ${ecartsDuMois(s)}.` };
  } else {
    a = { dose: 0, grand: 'Pas de dose ce soir', texte: 'Le plan ne prévoit plus de dose de secours.', conseils: true };
  }
  const b = { dose: 0, grand: 'Pas de dose ce soir',
              texte: budget > 0 ? `Tu gardes ${pluriel(budget, 'nuit')} en réserve pour une nuit où ça compte.` : '' };
  return { sleep: a, risk: b };
}
const blocConseils = () => `<div class="carte"><strong>Pour une nuit sans dose</strong><ul class="conseils">${TEXTES.conseils.map(t => `<li>${t}</li>`).join('')}</ul></div>`;
const NOMS_SCENARIO = { sleep: 'Je dois bien dormir ce soir', risk: 'Je peux prendre le risque de moins dormir' };

function rendreSoir() {
  const s = soirCourant(), c = situer(s), z = $('soirContenu');
  if (c.avant) { z.innerHTML = `<div class="carte">Le plan commence le ${joli(etat.plan.startDate)}.</div>`; return; }
  const p = c.palier;
  const utilisees = nuitsAvecDose(c.debutSemaine, s);
  const budget = Math.max(0, p.nightsPerWeek - utilisees);
  const manquantes = nuitsSansJournal(c, s);
  const cartes = cartesSoir(c, budget, s);
  const deja = etat.jours[s]?.evening;

  let h = `<p class="doux">${joli(s)} · ${p.label}${c.fini ? ' (plan terminé)' : `, semaine ${c.semDansPalier} sur ${p.durationWeeks}`}</p>`;
  h += `<p>Nuits avec dose restantes cette semaine : <strong>${budget} sur ${p.nightsPerWeek}</strong></p>`;
  if (manquantes) h += `<p class="alerte petit">${pluriel(manquantes, 'matin')} sans journal cette semaine : le compte peut être faux.</p>`;
  if (c.semDansPalier === 1 && !deja) h += `<div class="carte petit">${TEXTES.rebond}</div>`;
  if (c.fini) h += `<div class="carte">${TEXTES.finPlan}</div>`;
  // Dernier soir de la semaine du plan : la suggestion hebdomadaire s'affiche aussi ici
  const suggestionCeSoir = !c.fini && ajouter(c.debutSemaine, 6) === s ? carteSuggestion(c.semPlan) : '';

  if (deja && !modifierSoir) {
    const carte = cartes[deja.scenario];
    h += `<div class="carte"><div class="titre-carte">${NOMS_SCENARIO[deja.scenario]}</div>` +
         `<div class="grand">${deja.recommendedDoseMg > 0 ? mg(deja.recommendedDoseMg) : 'Pas de dose ce soir'}</div>` +
         `<p class="doux petit">Choix enregistré à ${deja.decidedAt.slice(11, 16)}.</p>` +
         `<button class="lien" id="soirChanger">changer</button></div>`;
    if (deja.recommendedDoseMg === 0) h += blocConseils();
    z.innerHTML = h + suggestionCeSoir;
    $('soirChanger').onclick = () => { modifierSoir = true; choixSoir = deja.scenario; rendreSoir(); };
    return;
  }

  for (const cle of ['sleep', 'risk']) {
    const k = cartes[cle];
    h += `<button class="choix" data-scenario="${cle}" aria-pressed="${choixSoir === cle}">` +
         `<div class="titre-carte">${NOMS_SCENARIO[cle]}</div>` +
         (k.avant ? `<div class="alerte">${k.avant}</div>` : '') +
         `<div class="grand">${k.grand}</div>` +
         (k.texte ? `<div class="doux">${k.texte}</div>` : '') + `</button>`;
  }
  h += `<button class="principal" id="soirOk" ${choixSoir ? '' : 'disabled'}>Confirmer</button>`;
  if (choixSoir && cartes[choixSoir].dose === 0) h += blocConseils();
  z.innerHTML = h + suggestionCeSoir;

  z.querySelectorAll('button.choix').forEach(b => b.onclick = () => { choixSoir = b.dataset.scenario; rendreSoir(); });
  $('soirOk').onclick = () => {
    const k = cartes[choixSoir], maintenant = isoLocal();
    etat.jours[s] = etat.jours[s] || { date: s };
    etat.jours[s].evening = { scenario: choixSoir, recommendedDoseMg: k.dose, decidedAt: maintenant };
    sauver();
    enFile('Soir', 'soir-' + s, {
      'Soir du': s, 'Scénario': NOMS_SCENARIO[choixSoir], 'Dose affichée (mg)': k.dose,
      'Palier': p.label, 'Nuits restantes': budget, 'Décidé le': maintenant,
    });
    modifierSoir = false; choixSoir = null;
    rendreSoir();
  };
}

// ---------- Ce matin ----------
let saisieMatin = null, messageMatin = '';
const estTardive = t => !!t && t >= '01:00' && t < '12:00';
function rendreMatin() {
  const d = aujourdhui(), nuit = ajouter(d, -1), z = $('matinContenu');
  const existant = etat.jours[d]?.morning;
  if (!saisieMatin || saisieMatin.date !== d) {
    saisieMatin = existant ? { date: d, ...existant } : {
      date: d, fog: 5, sleepQuality: 5, awakenings: 1,
      doseTaken: etat.jours[nuit]?.evening?.recommendedDoseMg ?? 0, doseTime: '', note: '',
    };
  }
  const m = saisieMatin;
  let h = `<p class="doux">Nuit du ${joli(nuit)}${existant ? ' · déjà enregistrée, modifiable' : ''}</p>`;
  h += `<label class="ligne" for="mFog">Brouillard <span id="vFog">${m.fog}</span></label><input type="range" id="mFog" min="0" max="10" value="${m.fog}">`;
  h += `<label class="ligne" for="mSleep">Qualité du sommeil <span id="vSleep">${m.sleepQuality}</span></label><input type="range" id="mSleep" min="0" max="10" value="${m.sleepQuality}">`;
  h += `<label class="ligne" for="mAw">Réveils <span id="vAw">${m.awakenings >= 5 ? '5+' : m.awakenings}</span></label><input type="range" id="mAw" min="0" max="5" value="${m.awakenings}">`;
  h += `<label class="ligne">Dose réellement prise</label><div class="segments">` +
       DOSES.map(x => `<button data-dose="${x}" aria-pressed="${m.doseTaken === x}">${x === 0 ? 'Aucune' : String(x).replace('.', ',')}</button>`).join('') + `</div>`;
  h += `<div id="blocHeure" ${m.doseTaken > 0 ? '' : 'hidden'}><label class="ligne" for="mTime">Heure de prise</label><input type="time" id="mTime" value="${m.doseTime || ''}">` +
       `<p class="alerte petit" id="mTardive" ${estTardive(m.doseTime) ? '' : 'hidden'}>${TEXTES.tardive}</p></div>`;
  h += `<label class="ligne" for="mNote">Note (facultatif)</label><input type="text" id="mNote">`;
  h += `<button class="principal" id="matinOk">Enregistrer</button><div id="matinMessage">${messageMatin}</div>`;
  z.innerHTML = h;
  $('mNote').value = m.note || '';

  const curseur = (id, cle, aff, fmt = v => v) => $(id).oninput = e => { m[cle] = Number(e.target.value); $(aff).textContent = fmt(m[cle]); };
  curseur('mFog', 'fog', 'vFog');
  curseur('mSleep', 'sleepQuality', 'vSleep');
  curseur('mAw', 'awakenings', 'vAw', v => v >= 5 ? '5+' : v);
  z.querySelectorAll('.segments button').forEach(b => b.onclick = () => {
    m.doseTaken = Number(b.dataset.dose);
    z.querySelectorAll('.segments button').forEach(x => x.setAttribute('aria-pressed', x === b));
    $('blocHeure').hidden = !(m.doseTaken > 0);
  });
  $('mTime').oninput = e => { m.doseTime = e.target.value; $('mTardive').hidden = !estTardive(m.doseTime); };
  $('mNote').oninput = e => { m.note = e.target.value; };

  $('matinOk').onclick = () => {
    const entree = { fog: m.fog, sleepQuality: m.sleepQuality, awakenings: m.awakenings, doseTaken: m.doseTaken };
    if (m.doseTaken > 0 && m.doseTime) entree.doseTime = m.doseTime;
    if (m.note && m.note.trim()) entree.note = m.note.trim();
    etat.jours[d] = etat.jours[d] || { date: d };
    etat.jours[d].morning = entree;
    sauver();
    const c = situer(nuit), ecart = estEcart(nuit);
    enFile('Matin', 'matin-' + d, {
      'Nuit du': nuit, 'Brouillard': entree.fog, 'Sommeil': entree.sleepQuality, 'Réveils': entree.awakenings,
      'Dose (mg)': entree.doseTaken, 'Heure de prise': entree.doseTime || '', 'Écart': ecart ? 'oui' : '',
      'Palier': c.avant ? '' : c.palier.label, 'Note': entree.note || '', 'Saisi le': isoLocal(),
    });
    messageMatin = `<p><strong>Enregistré.</strong></p>` +
      (ecart ? `<div class="carte">${TEXTES.ecart}</div>` : '') +
      (estTardive(entree.doseTime) ? `<p class="alerte">${TEXTES.tardive}</p>` : '');
    saisieMatin = null;
    rendreMatin();
    messageMatin = '';
  };
}

// ---------- Semaine ----------
const court = s => versDate(s).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
function rendreSemaine() {
  const z = $('semaineContenu'), cs = situer(soirCourant());
  if (cs.avant) { z.innerHTML = `<div class="carte">Le plan commence le ${joli(etat.plan.startDate)}.</div>`; return; }
  const max = cs.semPlan;
  if (semVue == null || semVue > max) semVue = max;
  const w = semVue, st = statsSemaine(w), c = situer(st.debut), auj = soirCourant();
  let h = `<div class="nav-sem"><button class="secondaire" id="semPrec" ${w > 0 ? '' : 'disabled'} aria-label="Semaine précédente">‹</button>` +
          `<div style="text-align:center"><strong>Semaine ${w + 1}</strong> · ${c.palier.label}<br><span class="doux petit">nuits du ${court(st.nuits[0])} au ${court(st.nuits[6])}</span></div>` +
          `<button class="secondaire" id="semSuiv" ${w < max ? '' : 'disabled'} aria-label="Semaine suivante">›</button></div>`;
  h += carteSuggestion(w, w === max);
  h += `<div class="carte"><div class="grille">`;
  st.nuits.forEach((n, i) => {
    const m = st.matins[i];
    const jourSem = versDate(n).toLocaleDateString('fr-CA', { weekday: 'short' }).replace('.', '');
    const cl = !m ? 'inconnu' : estEcart(n) ? 'ecart' : m.doseTaken === 0 ? '' : m.doseTaken < 3.75 ? 'demi' : 'pleine';
    h += `<div><div class="${n === auj ? 'auj' : 'j'}">${jourSem}<br>${versDate(n).getDate()}</div><div class="pa ${cl}"></div>` +
         `<div class="barres">${m ? `<div class="b-fog" style="height:${m.fog * 6}px"></div><div class="b-sleep" style="height:${m.sleepQuality * 6}px"></div>` : ''}</div></div>`;
  });
  h += `</div><div class="legende">` +
       `<span><span class="pa"></span>sans dose</span><span><span class="pa demi"></span>1,875</span><span><span class="pa pleine"></span>3,75 et plus</span>` +
       `<span><span class="pa ecart"></span>écart</span><span><span class="pa inconnu"></span>pas de journal</span>` +
       `<span><span class="b b-fog"></span>brouillard</span><span><span class="b b-sleep"></span>sommeil</span></div></div>`;
  const avecDose = st.matins.filter(m => m && m.doseTaken > 0).length;
  h += `<div class="carte petit">Nuits avec dose : <strong>${avecDose}</strong> sur ${c.palier.nightsPerWeek} permises · écarts : <strong>${st.ecarts}</strong><br>` +
       `Moyennes : brouillard <strong>${st.brouillard == null ? '-' : fmt1(st.brouillard)}</strong>, sommeil <strong>${st.sommeil == null ? '-' : fmt1(st.sommeil)}</strong> (${pluriel(st.nbSaisis, 'matin')} saisi${st.nbSaisis > 1 ? 's' : ''})</div>`;
  z.innerHTML = h;
  $('semPrec').onclick = () => { semVue = w - 1; rendreSemaine(); };
  $('semSuiv').onclick = () => { semVue = w + 1; rendreSemaine(); };
}

// ---------- Plan ----------
function graphique(total, cs) {
  const W = 320, H = 150, gauche = 30, bas = 18, haut = 10, bw = (W - gauche) / total;
  const prevu = [], reel = [];
  for (let w = 0; w < total; w++) {
    const p = situer(debutSem(w)).palier;
    prevu.push(p.doseMg * p.nightsPerWeek);
    if (!cs.avant && w <= cs.semPlan) {
      let t = 0; for (let i = 0; i < 7; i++) t += doseNuit(ajouter(debutSem(w), i)) || 0;
      reel.push(t);
    } else reel.push(null);
  }
  const max = Math.max(1, ...prevu, ...reel.filter(x => x != null));
  const y = v => H - bas - v / max * (H - bas - haut);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Milligrammes par semaine, prévu et réel">`;
  s += `<text x="0" y="${haut + 4}">${String(+max.toFixed(2)).replace('.', ',')}</text><text x="0" y="${H - bas}">0</text>`;
  s += `<line x1="${gauche}" x2="${W}" y1="${H - bas}" y2="${H - bas}" stroke="var(--trait)"/>`;
  for (let w = 0; w < total; w++) {
    const x = gauche + w * bw;
    if (prevu[w] > 0) s += `<rect x="${x + 1}" y="${y(prevu[w])}" width="${bw - 2}" height="${H - bas - y(prevu[w])}" fill="none" stroke="var(--doux)" stroke-width="1"/>`;
    if (reel[w]) s += `<rect x="${x + bw * .25}" y="${y(reel[w])}" width="${bw * .5}" height="${H - bas - y(reel[w])}" fill="var(--accent)"/>`;
    if (w % 2 === 0) s += `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${w + 1}</text>`;
  }
  return s + `</svg><div class="legende"><span><span class="b" style="border:1px solid var(--doux)"></span>mg prévus par semaine</span>` +
             `<span><span class="b b-sleep"></span>mg réellement pris</span></div>`;
}

function rendrePlan() {
  const c = situer(soirCourant()), total = totalSemaines(), paliers = etat.plan.paliers;
  const iCourant = c.avant ? -1 : paliers.indexOf(c.palier);
  const modifiable = i => c.avant || i > iCourant || (i === iCourant && !c.fini);
  const pct = c.avant ? 0 : c.fini ? 100 : Math.round(c.semPlan / total * 100);
  let h = `<p class="doux">Du ${joli(etat.plan.startDate)} au ${joli(ajouter(etat.plan.startDate, total * 7 - 1))}</p>` +
          `<p>${c.avant ? 'Le plan n\'a pas encore commencé.' : c.fini ? 'Plan terminé.' : `Semaine ${c.semPlan + 1} sur ${total}`}</p>` +
          `<div class="barre"><div style="width:${pct}%"></div></div>`;
  h += `<div class="carte"><table><tr><th>Palier</th><th>Sem.</th><th>Dose</th><th>Nuits</th><th>Secours</th></tr>`;
  let cumul = 0;
  paliers.forEach((p, i) => {
    const cl = [i === iCourant && !c.fini ? 'courant' : '', !c.avant && (i < iCourant || c.fini) ? 'passe' : '',
                modifiable(i) ? 'modifiable' : '', i === palierChoisi ? 'choisi' : ''].join(' ');
    h += `<tr class="${cl}" data-i="${i}"><td>${p.label}</td><td>${cumul + 1}-${cumul + p.durationWeeks}</td><td>${mg(p.doseMg)}</td>` +
         `<td>${p.nightsPerWeek}/sem</td><td>${p.rescueDoseMg == null ? 'aucune' : mg(p.rescueDoseMg)}</td></tr>`;
    cumul += p.durationWeeks;
  });
  h += `</table><p class="doux petit">Touche un palier en cours ou à venir pour le modifier. Les paliers passés restent tels quels.</p></div>`;

  if (palierChoisi != null && modifiable(palierChoisi)) {
    const p = paliers[palierChoisi], minDur = palierChoisi === iCourant ? c.semDansPalier : 1;
    const opts = (vals, cur, aff = v => v) => vals.map(v => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${aff(v)}</option>`).join('');
    const de = (a, b) => [...Array(b - a + 1)].map((_, k) => a + k);
    h += `<div class="carte"><strong>Modifier ${p.label}</strong>` +
         `<label class="ligne" for="eLabel">Nom</label><input type="text" id="eLabel" value="${p.label.replace(/"/g, '&quot;')}">` +
         `<div class="champs"><div><label class="ligne" for="eDur">Semaines</label><select id="eDur">${opts(de(minDur, 8), p.durationWeeks)}</select></div>` +
         `<div><label class="ligne" for="eNuits">Nuits/sem</label><select id="eNuits">${opts(de(0, 7), p.nightsPerWeek)}</select></div>` +
         `<div><label class="ligne" for="eDose">Dose</label><select id="eDose">${opts(DOSES, p.doseMg, mg)}</select></div>` +
         `<div><label class="ligne" for="eSec">Secours</label><select id="eSec">${opts(['aucune', 1.875, 3.75, 7.5], p.rescueDoseMg ?? 'aucune', v => v === 'aucune' ? v : mg(v))}</select></div></div>` +
         `<div class="boutons"><button class="principal" id="eOk">Enregistrer</button><button class="secondaire" id="eAnnuler">Annuler</button></div></div>`;
  }

  if (!c.avant && !c.fini) {
    h += `<div class="boutons"><button class="secondaire" data-action="prolongerPlan">Prolonger d'une semaine</button>` +
         `<button class="secondaire" data-action="recommencer">Recommencer le palier</button></div>`;
  }
  h += `<h2>Milligrammes par semaine</h2><div class="carte">${graphique(total, c)}</div>`;
  $('planContenu').innerHTML = h;

  $('planContenu').querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => {
    const i = Number(tr.dataset.i);
    if (!modifiable(i)) return;
    palierChoisi = palierChoisi === i ? null : i;
    rendrePlan();
  });
  if ($('eOk')) {
    $('eOk').onclick = () => {
      const p = paliers[palierChoisi], sec = $('eSec').value;
      p.label = $('eLabel').value.trim() || p.label;
      p.durationWeeks = Number($('eDur').value);
      p.nightsPerWeek = Number($('eNuits').value);
      p.doseMg = Number($('eDose').value);
      p.rescueDoseMg = sec === 'aucune' ? null : Number(sec);
      sauver();
      palierChoisi = null;
      rendrePlan();
    };
    $('eAnnuler').onclick = () => { palierChoisi = null; rendrePlan(); };
  }
}

function actionPlan(quoi) {
  const c = situer(soirCourant());
  if (c.avant || c.fini) return;
  const p = c.palier, paliers = etat.plan.paliers, i = paliers.indexOf(p);
  if (quoi === 'prolongerPlan') {
    if (!confirm(`Ajouter une semaine au palier ${p.label} ? Les paliers suivants sont décalés d'autant.`)) return;
    p.durationWeeks += 1;
  } else {
    if (!confirm(`Recommencer le palier ${p.label} ? La semaine en cours se termine, puis le palier repart à la semaine 1.`)) return;
    const copie = { ...p, id: 'p' + Date.now().toString(36), label: p.label + ' (reprise)' };
    p.durationWeeks = c.semDansPalier;
    paliers.splice(i + 1, 0, copie);
  }
  sauver();
  rendrePlan();
}

// ---------- Réglages ----------
function rendreReglages() {
  $('regDate').value = etat.plan?.startDate || '';
  $('regUrl').value = etat.cfg.url || '';
  majFile();
}
$('regDateOk').onclick = () => {
  const d = $('regDate').value;
  if (!d) return;
  if (!etat.plan) { etat.plan = { startDate: d, paliers: structuredClone(PLAN_DEFAUT) }; }
  else if (!confirm('Changer la date de début ? Le journal est conservé, mais les paliers sont recalculés.')) return;
  etat.plan.startDate = d;
  sauver();
  alert('Date enregistrée.');
};
$('regUrlOk').onclick = () => { etat.cfg.url = $('regUrl').value.trim(); sauver(); envoyer(); };
$('regEnvoyer').onclick = () => envoyer();
$('regExport').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(etat, null, 2)], { type: 'application/json' }));
  a.download = `palier-${aujourdhui()}.json`;
  a.click();
};
$('regImportBtn').onclick = () => $('regImport').click();
$('regImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const x = JSON.parse(await f.text());
    if (!x || typeof x.jours !== 'object' || !('plan' in x)) throw new Error('fichier non reconnu');
    if (!confirm('Remplacer toutes les données de ce téléphone par ce fichier ?')) return;
    etat = { plan: x.plan, jours: x.jours, decisions: x.decisions || {}, cfg: x.cfg || { url: '' }, file: x.file || [] };
    sauver();
    alert('Import terminé.');
    afficher('reglages');
  } catch (err) { alert('Import impossible : ' + err.message); }
};
$('regReset').onclick = () => {
  if (!confirm('Effacer le plan et tout le journal de ce téléphone ?')) return;
  if (!confirm('Vraiment ? Pense à exporter avant.')) return;
  localStorage.removeItem(CLE);
  etat = charger();
  afficher('depart');
};

// ---------- Démarrage ----------
function majReseau() { $('reseau').textContent = navigator.onLine ? 'En ligne' : 'Hors ligne'; }
